<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Achilles' Silly World</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;text-align:center;background:#fff1c7;color:#29344b;margin:0}main{max-width:650px;margin:auto;padding:16px}h1{font-size:clamp(29px,8vw,46px)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:3px solid white;border-radius:24px;background:#c8eafa;padding:15px;font:800 21px system-ui;min-height:90px;color:#29344b;touch-action:manipulation}button:active{transform:scale(.96)}.grid button{min-height:150px}.grid span{display:block;font-size:58px}.grid button:nth-child(2n){background:#ffd2e8}.grid button:nth-child(3n){background:#c9f2c1}.hidden{display:none}.play{background:linear-gradient(#c3eeff,#fff9dd);border-radius:28px;min-height:360px;padding:15px;margin:14px 0}.big{border:0;background:transparent;font-size:110px;min-height:180px}.bubble{border-radius:50%;width:28%;aspect-ratio:1;background:#c7e9ff;font-size:34px;min-height:75px;margin:2%}.word{font-size:32px;font-weight:900}video{width:100%;max-width:330px;border-radius:24px;transform:scaleX(-1)}.face{position:relative;display:inline-block}.hat{position:absolute;top:0;left:0;right:0;font-size:55px}.bar{display:flex;justify-content:space-between;gap:8px}.bar button{font-size:16px;min-height:48px;padding:9px}.actions{display:flex;gap:10px;justify-content:center}.actions button{background:#ffe18a}#message{font-size:22px;font-weight:800;min-height:35px}</style></head><body><main><section id="home"><h1>🌈 Achilles' Silly World!</h1><p>Hi Achilles! Tap something fun!</p><div class="grid"><button data-mode="friends"><span>🐸</span>Silly Friends</button><button data-mode="bubbles"><span>🫧</span>Bubble Pop</button><button data-mode="cars"><span>🚗</span>Go Go Go!</button><button data-mode="surprise"><span>🎁</span>Surprise Box</button><button data-mode="faces"><span>🤳</span>Funny Face</button><button data-mode="animals"><span>🐮</span>Animal Sounds</button></div><p>❤️ No scores. No timers. Just fun!</p></section><section id="game" class="hidden"><div class="bar"><button id="homeBtn">🏠 Home</button><strong id="heading"></strong><button id="soundBtn">🔊 On</button></div><div class="play" id="play"></div><div id="message" aria-live="polite"></div><div class="actions"><button id="again">🔁 Again!</button><button id="next">✨ Next!</button></div></section></main><script>(()=>{const $=id=>document.getElementById(id);const sets={friends:[['🐸','Ribbit!'],['🐵','Ooh ooh!'],['🐷','Oink!'],['🐥','Peep peep!'],['🦁','Roar!']],cars:[['🚗','Beep beep!'],['🚒','Wee oo!'],['🚂','Choo choo!'],['🚜','Vroom!']],animals:[['🐮','Moo!'],['🐱','Meow!'],['🐶','Woof!'],['🐑','Baa!']],surprise:[['🎁','Surprise!'],['🦄','Wow!'],['🐙','Wiggle!'],['🦖','Rawr!'],['🎉','Hooray!']]};let mode='',index=0,mute=false,stream=null;function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}function say(t){$('message').textContent=t;if(!mute&&window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.82;u.pitch=1.2;speechSynthesis.speak(u)}}function render(){$('play').replaceChildren();$('message').textContent='';const area=$('play');if(mode==='bubbles'){for(let i=0;i<9;i++){const b=document.createElement('button');b.className='bubble';b.textContent='🫧';b.setAttribute('aria-label','Pop bubble');b.addEventListener('click',()=>{b.textContent=['🌟','🐸','🌈','❤️'][Math.floor(Math.random()*4)];say('Pop!');setTimeout(()=>{if(b.isConnected)b.textContent='🫧'},800)});area.append(b)}return}if(mode==='faces'){const p=document.createElement('p');p.textContent='See yourself with silly hats!';area.append(p);const wrap=document.createElement('div');wrap.className='face';const v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.muted=true;const hat=document.createElement('div');hat.className='hat';hat.textContent=['👑','🤠','🐰','🎩','🦄'][index%5];wrap.append(v,hat);area.append(wrap);const start=document.createElement('button');start.textContent='📷 Start camera';area.append(document.createElement('br'),start);start.addEventListener('click',async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPS required');stop();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});v.srcObject=stream;start.disabled=true;say('Hello Achilles!')}catch(e){$('message').textContent='Camera unavailable. Other games still work!'}});return}const item=sets[mode][index%sets[mode].length];const b=document.createElement('button');b.className='big';b.textContent=item[0];const word=document.createElement('div');word.className='word';word.textContent=mode==='surprise'&&index%sets[mode].length===0?'What is inside?':item[1];b.addEventListener('click',()=>{if(mode==='surprise'&&index%sets[mode].length===0){index++;render();say('Surprise!')}else say(item[1])});area.append(b,word)}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{stop();mode=b.dataset.mode;index=0;$('home').classList.add('hidden');$('game').classList.remove('hidden');$('heading').textContent=b.textContent.trim();render()}));$('homeBtn').addEventListener('click',()=>{stop();if(window.speechSynthesis)speechSynthesis.cancel();$('game').classList.add('hidden');$('home').classList.remove('hidden')});$('next').addEventListener('click',()=>{index++;render()});$('again').addEventListener('click',()=>{if(mode==='faces'){index++;render()}else if(mode==='bubbles')render();else $('play').querySelector('.big')?.click()});$('soundBtn').addEventListener('click',()=>{mute=!mute;$('soundBtn').textContent=mute?'🔇 Off':'🔊 On';if(mute&&window.speechSynthesis)speechSynthesis.cancel()});window.addEventListener('pagehide',stop)})();</script></body></html>
